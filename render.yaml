# Render Blueprint — deploy frontend + API
# https://render.com/docs/blueprint-spec

services:
  # Frontend — static site (free tier)
  - type: web
    name: lyra
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_USE_API
        value: "true"
      - key: VITE_API_URL
        sync: false  # Set to your API URL, e.g. https://lyra-api.onrender.com/api
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API — web service (free tier)
  - type: web
    name: lyra-api
    runtime: node
    region: singapore
    rootDir: api
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3001"
      - key: CORS_ORIGINS
        sync: false  # Set to your frontend URL
      - key: FRONTEND_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false  # e.g. libsql://your-db-name.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
