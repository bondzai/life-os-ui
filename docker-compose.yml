# Lyra — the whole stack.
#
#   docker compose up -d --build
#
# The TypeScript API this replaced was deleted on 2026-08-19; `git log -- api/` has it if you
# ever need to look. The project name is kept from the cutover so an existing deployment's
# volumes (lyra-rust_lyra-data, lyra-rust_ollama-models) keep resolving — renaming it would
# silently start a second, empty database.
#
# ── NOT THE DEPLOYMENT PATH ANY MORE (2026-09-25) ──
# The mini PC runs one binary under systemd; `lyra-api` serves the front end itself via
# LYRA_UI_DIR, which makes the `ui`/nginx service here redundant. docs/deployment.md describes that
# and no longer documents this stack — the section references below point at a rewritten document.
# This file still builds and is kept for the Ollama service and for a container-shaped deploy, but
# nothing maintained uses it. `git log -- docs/deployment.md` has the instructions it belonged to.
name: lyra-rust

services:
  # ── The Rust API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: lyra-api:local
    restart: unless-stopped
    environment:
      # Required. The binary exits 1 when this is missing or empty — by design, so it can never
      # sign tokens with a fallback secret. Generate one with:
      #   openssl rand -base64 48
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — see docs/deployment.md}

      # SQLite lives on the named volume mounted at /data.
      - LYRA_DB=/data/lyra.db
      - PORT=3001

      # Comma-separated allow-list. Defaults inside the binary are localhost:5173 and
      # localhost:8080. With nginx proxying /api the browser is same-origin, so this only
      # matters for direct API access (a phone hitting the API port, local `npm run dev`).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

      - RUST_LOG=${RUST_LOG:-info}

      # Knowledge module (optional). Points at the git repo holding the markdown notes; must
      # match the bind mount below. Unset, the binary looks for ../lyra-knowledge relative to
      # its working directory, which inside the container is /lyra-knowledge and will not exist.
      # - LYRA_KNOWLEDGE_PATH=/knowledge
      # The module commits with `git commit`; without an identity git refuses and the write is
      # silently not versioned.
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Lyra}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-lyra@localhost}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-Lyra}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-lyra@localhost}

      # Google Calendar (optional). Without GOOGLE_CLIENT_ID/SECRET/REDIRECT_URI the OAuth
      # endpoints return "Google OAuth not configured" and the rest of the app is unaffected.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Must byte-for-byte match the redirect URI registered in Google Cloud Console, e.g.
      # http://lyra.local:8080/api/gcal/auth/callback
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Where the OAuth callback sends the browser back to. Defaults to localhost:5173 in the
      # binary, which is the dev server — set it to the mini PC's UI origin.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      # Only for public/embedded calendar reads; falls back to a built-in public embed key.
      - GCAL_API_KEY=${GCAL_API_KEY:-}

      # ── Wealth ───────────────────────────────────────────────────────────
      # Deliberately NOT listed here. `environment:` wins over `env_file:`, so declaring
      # `ALERT_WALLETS=${ALERT_WALLETS:-}` would overwrite the real value from `.env.local` with
      # an empty string whenever the host shell had not exported it — a blank Holdings page with
      # a healthy container and nothing in the log. They come in through `env_file` below:
      #
      #   ALERT_WALLETS        wallets the sweep and digest cover (comma/space separated)
      #   KUCOIN_API_KEY       read-only exchange credentials. Trade permission is not needed and
      #   KUCOIN_API_SECRET    must not be granted: nothing in this stack places an order, so a
      #   KUCOIN_API_PASSPHRASE  key that can trade only adds blast radius.
      #   TELEGRAM_BOT_TOKEN   unset, /alerts/test and /alerts/digest answer 400 and the sweep
      #   TELEGRAM_CHAT_ID     still runs, recording state without sending — what you want on a
      #                        first boot.
      #   ALERT_INTERVAL       seconds between sweeps (default 900)
      #   SNAPSHOT_INTERVAL    seconds between net-worth snapshots
      #   DIGEST_HOUR          local hour for the daily brief; UNSET means no digest is ever sent
      #   ALERT_FEE_USD        claimable threshold that triggers a harvest nudge
      #   ALERT_HF             health factor below which a borrow is called out
      #   ALERT_REPORT_CCY     currency the digest reports in
      #   SNAPSHOT_GROUP       which group the snapshot cron writes under
      #   REQUEST_DEADLINE     chain fan-out budget, seconds (AggregateConfig::from_env)
      #   ADAPTER_CONCURRENCY  parallel adapter reads
      #
      # Without them the API still starts and every wealth surface renders an empty book, which
      # is why a blank page is the symptom of a missing variable rather than a crash.
    # `.env.local` is gitignored and mode 600 — the only copy on disk of the KuCoin key and the
    # Telegram token, so it is the one file to back up alongside the database.
    env_file:
      - .env.local
    volumes:
      # ONE volume for the database. SQLite runs in WAL mode (crates/lyra-db/src/lib.rs), so
      # lyra.db is always accompanied by lyra.db-wal and lyra.db-shm. Those sidecars hold
      # committed data that is not yet in the main file — they must sit in the same directory,
      # on the same volume, or the database is corrupt/stale. Never mount lyra.db as a single
      # file, and never back up the .db alone. See docs/deployment.md → Backups.
      - lyra-data:/data
      # Knowledge repo (optional) — uncomment together with LYRA_KNOWLEDGE_PATH above.
      # - ../lyra-knowledge:/knowledge
    # Not published by default: nginx reaches it over the compose network. Uncomment to hit the
    # API directly — from a phone on the LAN, or a local `npm run dev` pointed at it.
    # ports:
    #   - "3001:3001"
    expose:
      - "3001"
    healthcheck:
      # GET /api/health runs `SELECT 1` against the pool, so a failure here means the process
      # is up but storage is not — exactly what you want to restart on.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── One-shot schema + legacy import ────────────────────────────────────────
  # Never starts with `up` (profile-gated). Run it once before the first `up`:
  #
  #   docker compose run --rm migrate \
  #       /data/lyra.db --from-lyra /legacy/life-os.db --from-pow /legacy/pow.db
  #
  # Safe to re-run: migrations are versioned and the import is INSERT OR IGNORE.
  migrate:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    image: lyra-api:local
    entrypoint: ["lyra-migrate"]
    command: ["/data/lyra.db"]
    volumes:
      - lyra-data:/data
      # Read-only copies of the legacy databases. Copy them (with their -wal/-shm sidecars)
      # into ./legacy on the host first — see docs/deployment.md → First run.
      - ./legacy:/legacy:ro

  # ── Front end ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        # Build-time, not runtime: Vite inlines these into the bundle. Changing them requires
        # `--build` to take effect.
        VITE_USE_API: "true"
        VITE_API_URL: /api
    image: lyra-ui:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8080}:80"
    volumes:
      # Mounted so the CSP (Ollama origin, in particular) can be edited and applied with a
      # restart instead of a rebuild.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Local LLM ──────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Published on purpose: the BROWSER calls Ollama directly (src/hooks/use-ai-health.ts,
      # src/core/hooks/use-ai-chat.ts) — the API never proxies it. If this port is not reachable
      # from the device running the browser, AI features show as offline and fall back to
      # algorithmic mode.
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Models are gigabytes; a named volume keeps them across image updates.
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Continuous SQLite backup (OPTIONAL — disabled) ─────────────────────────
  # Litestream tails the WAL and streams it to object storage. No application changes: it reads
  # the same file the API writes, so the API stays untouched and unaware.
  #
  # To enable:
  #   1. cp litestream.example.yml litestream.yml
  #   2. Fill in your bucket and credentials in litestream.yml (it is gitignored — keep it that
  #      way; the placeholders in the example file are NOT working credentials).
  #   3. Uncomment the service below. It shares the lyra-data volume with the API — no extra
  #      volume, because Litestream must see the same .db/-wal/-shm set the API is writing.
  #   4. docker compose up -d litestream
  #
  # Restore procedure is in docs/deployment.md → Restore.
  #
  # litestream:
  #   image: litestream/litestream:0.3.13
  #   restart: unless-stopped
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   command: ["replicate"]
  #   volumes:
  #     - lyra-data:/data
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #   environment:
  #     # Prefer real env vars or a secrets manager over inlining keys in litestream.yml.
  #     - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
  #     - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}

volumes:
  # lyra.db + lyra.db-wal + lyra.db-shm. One volume, deliberately — see the api service.
  lyra-data:
  ollama-models:
