# Serves the built SPA and proxies /api to the lyra-api container.
# docker-compose.yml mounts this file read-only, so edits take effect with
# `docker compose restart ui` — no image rebuild.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # connect-src, in order:
    #   'self'                  — /api, proxied below.
    #   localhost:11434         — Ollama. The BROWSER talks to Ollama directly (see
    #                             src/hooks/use-ai-health.ts and src/core/hooks/use-ai-chat.ts);
    #                             it is not proxied through the API. Add the mini PC's LAN
    #                             origin here too — e.g. http://192.168.1.50:11434 — or the AI
    #                             features will be blocked for every device except the machine
    #                             running the browser on the host itself.
    #   *.googleapis.com        — Google Calendar reads made from the client.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:11434 http://127.0.0.1:11434 https://*.googleapis.com;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Google OAuth callbacks and calendar syncs can be slow; the defaults (60s) are fine,
        # but be explicit so a hung upstream fails predictably.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
