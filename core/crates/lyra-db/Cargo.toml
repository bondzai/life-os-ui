[package]
name = "lyra-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
