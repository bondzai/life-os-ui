[package]
name = "lyra-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Already compiled in this tree as rustls' crypto provider, so a direct dependency on it costs
# nothing and avoids pulling a second AEAD implementation in beside it.
aws-lc-rs = "1.18.0"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
