[package]
name = "lyra-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
lyra-alerts = { version = "0.1.0", path = "../lyra-alerts" }
lyra-context = { version = "0.1.0", path = "../lyra-context" }
lyra-chain = { version = "0.1.0", path = "../lyra-chain" }
lyra-db = { version = "0.1.0", path = "../lyra-db" }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "json", "macros"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
