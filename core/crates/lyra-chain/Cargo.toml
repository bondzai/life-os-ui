[package]
name = "lyra-chain"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
