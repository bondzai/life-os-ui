# Pinned, not "stable".
#
# `channel = "stable"` means CI runs whatever stable is that morning, and clippy gains lints as it
# goes. With `-D warnings` in the gate that turns a Rust release into a red build on a commit that
# changed nothing — which is exactly what happened the first time this pipeline ran: the runner's
# clippy had a `chunks_exact` lint that 1.97.1 does not, and three untouched lines in
# `lyra-chain/src/abi.rs` failed the build.
#
# Pinned, the gate is reproducible and a toolchain upgrade is a deliberate commit that fixes the
# new lints at the same time — rather than an ambush timed by someone else's release schedule.
# Same reasoning as `ubuntu-24.04` instead of `ubuntu-latest` in the workflows.
#
# To upgrade: bump this, run `cargo clippy --workspace --all-targets -- -D warnings`, fix what it
# now says, and commit the two together.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
