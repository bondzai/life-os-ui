# Litestream — optional, continuous backup of lyra.db to object storage.
#
# Copy to litestream.yml, fill in the placeholders, then uncomment the `litestream` service in
# docker-compose.rust.yml. Nothing below is a real credential; the file you create from it will
# hold secrets, so keep litestream.yml out of git (it is already gitignored).
#
# How it works: Litestream opens the same SQLite file the API writes, follows the WAL, and ships
# each frame to the replica. No application change, no downtime, and a restore rebuilds the
# database to any point within the retention window.

dbs:
  - path: /data/lyra.db

    replicas:
      # ── S3 / S3-compatible (Backblaze B2, MinIO, Cloudflare R2) ──
      - type: s3
        bucket: REPLACE_WITH_YOUR_BUCKET
        path: lyra
        region: REPLACE_WITH_YOUR_REGION
        # For non-AWS providers set the endpoint, e.g.
        #   endpoint: s3.us-west-002.backblazeb2.com   (Backblaze B2)
        #   endpoint: https://<account>.r2.cloudflarestorage.com   (Cloudflare R2)
        # endpoint: REPLACE_WITH_YOUR_ENDPOINT

        # Credentials: leave these commented and pass LITESTREAM_ACCESS_KEY_ID /
        # LITESTREAM_SECRET_ACCESS_KEY as environment variables instead, so no key is ever
        # written to a file in the repo.
        # access-key-id:     ${LITESTREAM_ACCESS_KEY_ID}
        # secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}

        # Keep 72h of point-in-time restore, with a full snapshot every 12h.
        retention: 72h
        snapshot-interval: 12h
        sync-interval: 10s

      # ── Or a second disk / USB drive on the mini PC ──
      # Cheapest useful option if you would rather not use cloud storage. Mount the drive into
      # the litestream container (add `- /mnt/backup:/backup` to its volumes) and use:
      # - type: file
      #   path: /backup/lyra
      #   retention: 168h
